[project]
name = "saif1"
version = "0.1.0"
description = "SAIF1 - an independent F1 data, strategy, and performance analytics platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
